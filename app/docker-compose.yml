services:
  django:
    build:
      context: ./django
    ports:
      - 8000
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env.runtime
    restart: unless-stopped


  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - django
    restart: unless-stopped
    

volumes:
  static_volume:

networks:
  default:
    name: red_app
