services:
  django:
    build:
      context: ./django
    command: sh -c "python manage.py collectstatic --noinput && gunicorn core.wsgi --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/app/staticfiles

  react:
    build:
      context: ./react/getbetter

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./react/getbetter/dist:/var/www/react
      - static_volume:/var/www/static:ro
    depends_on:
      - django
      - react


networks:
  default:
    external: true
    name: red_docker_proyecto

volumes:
  static_volume: