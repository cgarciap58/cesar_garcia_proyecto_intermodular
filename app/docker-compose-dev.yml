services:
  django:
    build:
      context: ./django
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env.runtime
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - django

networks:
  default:
    external: true
    name: red_docker_proyecto

volumes:
  static_volume: